/* ---------------- HEDEFLERİM ---------------- */
function pageGoals() {
  const G = S.settings.goals; const g = goalStatus(today()); const { defs, hitWeeks, hitMonths, sk } = achievementDefs();
  const pr = personalRecords(); const ex = examsSorted().map(e => ({ e, ...examCalc(e) }));
  const last = ex[ex.length - 1]; const avg3 = ex.length ? sum(ex.slice(-3), c => c.net) / Math.min(3, ex.length) : null;
  const tSay = num(S.settings.targetSayNet), tSoz = num(S.settings.targetSozNet);
  const weeks = []; for (let i = 7; i >= 0; i--) { const w = addDays(weekStart(today()), -7 * i); weeks.push({ w, q: rangeAgg(w, addDays(w, 6)).q, hit: weekHit(w) }); }
  const months = []; { const d = new Date(); for (let i = 5; i >= 0; i--) { const x = dkey(new Date(d.getFullYear(), d.getMonth() - i, 1)).slice(0, 7); months.push({ m: x, hit: monthHit(x) }); } }
  const earned = defs.filter(d => S.meta.ach[d.k] || d.ok);
  const firstAct = [S.meta.created || today()].concat(S.logs.map(l => l.d)).reduce((a, b) => b < a ? b : a);
  const goalInput = (k, label, unit = '') => `<div class="field"><label>${label}</label><input type="number" min="0" inputmode="numeric" value="${G[k] || ''}" placeholder="0" data-goal="${k}">${unit ? `<span class="hint">${unit}</span>` : ''}</div>`;
  const cmp = (label, cur, tgt) => tgt ? `<div class="goal"><span class="gl">${label}</span><span class="gv num">${cur == null ? '—' : fmtNet(cur)} / ${fmtNet(tgt)}</span>${progBar(cur == null ? 0 : cur / tgt * 100, cur != null && cur >= tgt ? 'good' : '')}</div>` : '';
  return {
    title: 'Hedeflerim',
    html: `<div class="page-head"><div><h1>Hedeflerim</h1><p>Çalışma hedeflerini belirle; ilerlemen, serilerin ve rozetlerin otomatik takip edilir.</p></div></div>
    <div class="grid g2 mb">
      <div class="card"><div class="card-h"><h2>${ic('target')} Çalışma hedefleri</h2><span class="sub">Değişiklikler otomatik kaydedilir</span></div>
        <div class="form-grid">${goalInput('dailyQ', 'Günlük soru hedefi')}${goalInput('weeklyQ', 'Haftalık soru hedefi')}${goalInput('dailyMin', 'Günlük çalışma süresi', 'dakika')}${goalInput('weeklyMin', 'Haftalık çalışma süresi', 'dakika')}${goalInput('dailyTopics', 'Günlük konu tamamlama')}${goalInput('monthlyQ', 'Aylık soru hedefi', 'boş = günlük × gün sayısı')}${goalInput('dailySayQ', 'Günlük sayısal soru')}${goalInput('dailySozQ', 'Günlük sözel soru')}</div></div>
      <div class="card"><div class="card-h"><h2>${ic('chart')} Hedeflere göre durum</h2></div><div class="stack" style="gap:12px">
        ${goalRow('Bugün soru', g.day.q, int(G.dailyQ))}${goalRow('Bugün süre', g.day.m, int(G.dailyMin), fmtMin)}${goalRow('Bugün tamamlanan konu', g.topicsDone, int(G.dailyTopics))}${goalRow('Bugün sayısal', g.say.q, int(G.dailySayQ), fmtNum, 'say')}${goalRow('Bugün sözel', g.soz.q, int(G.dailySozQ), fmtNum, 'soz')}${goalRow('Bu hafta soru', g.week.q, int(G.weeklyQ))}${goalRow('Bu hafta süre', g.week.m, int(G.weeklyMin), fmtMin)}${goalRow('Bu ay soru', g.month.q, g.monthlyQ)}
        <div class="sep" style="margin:2px 0"></div>
        <div class="small"><b>Haftalık hedef başarısı</b> (son 8 hafta): ${weeks.filter(w => w.hit).length}/8 · toplam ${hitWeeks} hafta</div>
        <div class="row">${weeks.map(w => `<span class="chip ${w.hit ? 'good' : w.hit === false && w.w < weekStart(today()) && w.w >= weekStart(firstAct) ? 'crit' : ''}" title="${fmtNum(w.q)} soru">${fmtDate(w.w)}</span>`).join('')}</div>
        <div class="small"><b>Aylık hedef başarısı</b> (son 6 ay): ${months.filter(m => m.hit).length}/6 · toplam ${hitMonths} ay</div>
        <div class="row">${months.map(m => `<span class="chip ${m.hit ? 'good' : m.hit === false && m.m < today().slice(0, 7) && m.m >= firstAct.slice(0, 7) ? 'crit' : ''}">${TR_MS[+m.m.slice(5) - 1]} ${m.m.slice(2, 4)}</span>`).join('')}</div>
      </div></div>
    </div>
    <div class="grid g2 mb">
      <div class="card"><div class="card-h"><h2>${ic('exam')} Hedef netler ve denemeler</h2><a class="btn sm ghost" href="#ayarlar">Hedefleri düzenle</a></div>
        ${tSay || tSoz ? `<div class="stack" style="gap:12px">${cmp('Sayısal – son deneme', last ? last.sayNet : null, tSay)}${cmp('Sözel – son deneme', last ? last.sozNet : null, tSoz)}${cmp('Toplam – son deneme', last ? last.net : null, tSay + tSoz)}${cmp('Toplam – son 3 ortalaması', avg3, tSay + tSoz)}</div>` : '<div class="small muted">Ayarlar sayfasından hedef sayısal ve sözel netlerini girersen deneme sonuçlarınla karşılaştırılır.</div>'}
        ${!ex.length ? '<div class="small muted mt">Henüz deneme kaydı yok.</div>' : ''}
        <div class="note mt">${ic('info', 'sm')}<span>Bu uygulama DGS puanı tahmini yapmaz. ÖSYM ham puanları o yılki adayların dağılımına göre standart puana (ortalama 50, standart sapma 10) çevirir ve ÖBP ile katsayılarla birleştirir; bu yüzden aynı net farklı yıllarda farklı puana karşılık gelir. Hedef puanını${S.settings.targetScore ? ` (<b>${esc(S.settings.targetScore)}</b> ${esc(S.settings.scoreType)})` : ''} geçmiş yılların taban puanlarıyla kendin karşılaştırmalısın.</span></div></div>
      <div class="card"><div class="card-h"><h2>${ic('flame')} Seri ve kişisel rekorlar</h2></div>
        <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">${kpi('Güncel seri', sk.cur + ' gün', sk.todayDone ? 'bugün çalıştın' : 'bugün kayıt girersen devam eder')}${kpi('En uzun seri', pr.streak + ' gün', 'geçmiş başarılar silinmez')}${kpi('Günde en çok soru', fmtNum(pr.bestQ.v), pr.bestQ.d ? fmtDate(pr.bestQ.d) : '—')}${kpi('Günde en uzun çalışma', fmtMin(pr.bestM.v), pr.bestM.d ? fmtDate(pr.bestM.d) : '—')}${kpi('En iyi hafta', fmtNum(pr.bestW.v) + ' soru', pr.bestW.d ? fmtDate(pr.bestW.d) + ' haftası' : '—')}${kpi('En yüksek deneme', pr.bestExam ? fmtNet(pr.bestExam.net) + ' net' : '—', pr.bestExam ? esc(pr.bestExam.e.name) : '')}${kpi('En yüksek günlük başarı', fmtPct(pr.bestRate.v), pr.bestRate.d ? fmtDate(pr.bestRate.d) + ' · 30+ soru' : '30+ soru gerekli')}${kpi('Toplam çalışma günü', sk.total)}</div></div>
    </div>
    <div class="card"><div class="card-h"><h2>${ic('trophy')} Rozetler ve kilometre taşları</h2><span class="sub">${earned.length}/${defs.length} kazanıldı</span></div>
      <div class="badges">${defs.map(d => { const on = !!(S.meta.ach[d.k] || d.ok); return `<div class="badge ${on ? 'on' : ''}"><div class="bi">${ic(d.ders ? 'book' : d.k.startsWith('s') && /^s\d/.test(d.k) ? 'flame' : d.k.startsWith('exam') ? 'exam' : 'trophy')}</div><div class="bt">${esc(d.t)}</div><div class="bd">${on ? (S.meta.ach[d.k] ? fmtDate(S.meta.ach[d.k]) + ' · ' : '') + esc(d.d) : (d.p != null ? fmtPct(Math.min(99, d.p * 100)) + ' · ' : '') + esc(d.d)}</div></div>`; }).join('')}</div></div>`
  };
}

async function exportData(kind, fmt) {

function planSuggest(d) {
  const existing = new Set(S.plans.filter(p => p.d === d).map(p => p.t + '|' + p.kind)); const add = [];
  const rb = reviewBuckets();
  for (const i of rb.overdue.concat(rb.today).slice(0, 5)) if (!existing.has(i.id + '|tekrar')) add.push({ title: N(i.id).node.name + ' – tekrar', t: i.id, kind: 'tekrar', q: 0, m: 30 });
  const leaves = []; for (const [id, inf] of idx().nodes) if (inf.leaf && inf.agg.q) leaves.push(id);
  const weak = leaves.filter(id => ['kritik', 'pratik', 'unutma'].includes(classify(id).k)).sort((a, b) => priorityScore(b) - priorityScore(a)).slice(0, 3);
  for (const id of weak) if (!existing.has(id + '|soru')) add.push({ title: N(id).node.name + ' – soru pratiği', t: id, kind: 'soru', q: 40, m: 0 });
  const nv = []; for (const [id, inf] of idx().nodes) if (inf.leaf && !inf.opt && !inf.agg.n && (topicGet(id).status || 'baslanmadi') === 'baslanmadi') nv.push(id);
  if (nv.length && !add.some(a => a.kind === 'konu')) { const id = nv[0]; if (!existing.has(id + '|konu')) add.push({ title: N(id).node.name + ' – konu çalışması', t: id, kind: 'konu', q: 0, m: 45 }); }
  if (!add.length) { toast('Eklenecek yeni öneri yok.'); return; }
  commit(s => add.forEach(a => s.plans.push({ id: uid(), d, done: false, ts: Date.now(), ...a })));
  toast(`${add.length} görev plana eklendi.`, 'good');
}

  'src-del': async el => {
    const s = S.sources.find(x => x.id === el.dataset.id); if (!s) return; const n = S.logs.filter(l => l.src === s.id).length;
    if (!(await confirmDlg({ title: 'Kaynağı sil', text: `<b>${esc(s.name)}</b> silinsin mi?${n ? ` Bu kaynağa bağlı ${n} kayıt silinmez; yalnızca kaynak bilgisi kaldırılır ve konu toplamları aynı kalır.` : ''}`, ok: 'Sil', danger: true }))) return;
    commit(st => { st.sources = st.sources.filter(x => x.id !== s.id); st.logs.forEach(l => { if (l.src === s.id) l.src = ''; }); }); toast('Kaynak silindi.');
  },
  'an-rng': el => { UI.setF('analiz', 'rng', el.dataset.v); render(); },
  'an-sec': el => { UI.setF('analiz', 'sec', el.dataset.v); render(); },
  'cal-day': el => openDay(el.dataset.d),
  'cal-m': el => { UI.setF('takvim', 'm', el.dataset.v); render(); },
  'cal-metric': el => { UI.setF('takvim', 'metric', el.dataset.v); render(); },
  backup: () => backup(),
  exp: el => exportData(el.dataset.k, el.dataset.f),
  reset: () => resetAll(),
  'restore-defaults': () => restoreDefaults(),
  'fb-signout': () => Store.signOut(),
  'fb-install': () => installApp(),
  'fb-copy': async () => { try { await navigator.clipboard.writeText(FB.linkURL()); toast('Bağlantı kopyalandı. Diğer cihaza gönderip orada aç.', 'good'); } catch (e) { toast('Kopyalanamadı; bağlantıyı seçip elle kopyala.'); } },
  'copy-url': async () => { try { await navigator.clipboard.writeText(APP_URL); toast('Bağlantı kopyalandı.', 'good'); } catch (e) { toast('Kopyalanamadı; bağlantıyı seçip elle kopyala.'); } },
  'retry-save': () => { Store.dirty = true; Store.flush(); },
  'crit-edit': el => {
    const id = el.dataset.id; const c = criteriaFor(id);
    openModal({ title: 'Konu tamamlama kriterleri', body: `<form novalidate class="stack" data-cf><p class="small muted">"${esc(N(id).node.name)}" için genel ayarlardan farklı kriter belirle.</p><label class="chk"><input type="checkbox" name="enabled" ${c.enabled ? 'checked' : ''}> Bu konu için kriterleri kullan</label><label class="chk"><input type="checkbox" name="needLecture" ${c.needLecture ? 'checked' : ''}> Konu anlatımı bitmiş olmalı</label><div class="form-grid"><div class="field"><label>En az soru</label><input type="number" min="0" name="minQ" value="${int(c.minQ)}"></div><div class="field"><label>En az başarı (%)</label><input type="number" min="0" max="100" name="minRate" value="${num(c.minRate)}"></div></div></form>`, foot: '<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-ok>Kaydet</button>',
      onMount: (m, md) => m.querySelector('[data-ok]').addEventListener('click', () => { const f = m.querySelector('[data-cf]'); commit(s => { T(id).crit = { enabled: f.enabled.checked, needLecture: f.needLecture.checked, minQ: clamp(int(f.minQ.value), 0, 100000), minRate: clamp(num(f.minRate.value), 0, 100) }; }); md.close(); toast('Kriterler kaydedildi.', 'good'); maybeAutoComplete(id); }) });
  },
  'crit-reset': el => { commit(s => { delete T(el.dataset.id).crit; }); toast('Genel kriterler kullanılacak.'); },
  'chk-del': el => { commit(s => { const t = T(el.dataset.id); t.extra = (t.extra || []).filter(x => x.t !== el.dataset.t); t.chk = (t.chk || []).filter(x => x !== el.dataset.t); }); },
  'notes-save': el => { const ta = $(`[data-notes="${el.dataset.id}"]`); if (ta) saveNotes(el.dataset.id, ta.value); },
  'timer-open': () => openTimer(),
  'timer-toggle': () => Timer.startPause()
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.matches('select,input[type=checkbox],input[type=date]')) {
    const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); return; }
  }
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('button[data-act],a[href],select,input')) { const to = g.dataset.go; if (g.dataset.never) { UI.setF('mufredat', 'never', true); } if (to) location.hash = to; }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-go][tabindex],[role=button][data-act]')) { e.preventDefault(); e.target.click(); } });

let fT;
document.addEventListener('input', e => {
  const el = e.target;
  const debounced = (fn) => { clearTimeout(fT); fT = setTimeout(fn, 220); };
  if (el.dataset.tf && el.type === 'search') return debounced(() => { UI.setF(el.dataset.page, 'q', el.value); render(); });
  if (el.dataset.lf === 'q') return debounced(() => { UI.setF('sorular', 'q', el.value); render(); });
  if (el.dataset.mf === 'q') return debounced(() => { UI.setF('yanlislar', 'q', el.value); render(); });
  if (el.dataset.sf === 'q') return debounced(() => { UI.setF('kaynaklar', 'q', el.value); render(); });
});
document.addEventListener('change', e => {
  const el = e.target; const ds = el.dataset;
  if (ds.actChange === 'status') return setStatus(ds.id, el.value, el);
  if (ds.actChange === 'lecture') { commit(s => { T(ds.id).lecture = el.checked; }); toast(el.checked ? 'Konu anlatımı bitti olarak işaretlendi.' : 'İşaret kaldırıldı.', 'good', 1800); maybeAutoComplete(ds.id); return; }
  if (ds.actChange === 'target') { const v = int(el.value); commit(s => { if (v > 0) T(ds.id).target = v; else delete T(ds.id).target; }); return; }
  if (ds.actChange === 'chk') { commit(s => { const t = T(ds.id); const set = new Set(t.chk || []); el.checked ? set.add(ds.t) : set.delete(ds.t); t.chk = Array.from(set); }); return; }
  if (ds.actChange === 'task-toggle') { commit(s => { const p = s.plans.find(x => x.id === ds.id); if (p) { p.done = el.checked; p.doneAt = el.checked ? today() : null; } }); if (el.checked) toast('Görev tamamlandı.', 'good', 1500); return; }
  if (ds.actChange === 'plan-date') { if (isDKey(el.value)) { UI.setF('plan', 'd', el.value); render(); } return; }
  if (ds.tf && el.type !== 'search') { UI.setF(ds.page, ds.tf, el.type === 'checkbox' ? el.checked : el.value); return render(); }
  if (ds.lf && ds.lf !== 'q') { UI.setF('sorular', ds.lf, el.value); if (ds.lf === 'sec') { UI.setF('sorular', 'ders', ''); UI.setF('sorular', 'topic', ''); } UI.setF('sorular', 'lim', 50); return render(); }
  if (ds.mf && ds.mf !== 'q') { UI.setF('yanlislar', ds.mf, el.value); if (ds.mf === 'sec') UI.setF('yanlislar', 't', ''); return render(); }
  if (ds.ef) { UI.setF('denemeler', ds.ef, el.value); return render(); }
  if (ds.set) {
    const k = ds.set; let v = el.value;
    if (['minSample', 'staleDays', 'refQ'].includes(k)) { const lim = { minSample: [5, 500], staleDays: [3, 90], refQ: [20, 5000] }[k]; v = clamp(int(v) || lim[0], lim[0], lim[1]); }
    if (['targetSayNet', 'targetSozNet'].includes(k)) v = v === '' ? '' : clamp(num(v), 0, 50);
    if (k === 'examDate' && v && !isDKey(v)) { toast('Geçerli bir tarih seç.', 'error'); return; }
    commit(s => { s.settings[k] = v; }); toast('Ayar kaydedildi.', 'good', 1400); return;
  }
  if (ds.setb) { commit(s => { s.settings[ds.setb] = el.checked; }); toast('Ayar kaydedildi.', 'good', 1400); return; }
  if (ds.goal) { commit(s => { s.settings.goals[ds.goal] = Math.max(0, int(el.value)); }); toast('Hedef kaydedildi.', 'good', 1400); return; }
  if (ds.crit) { commit(s => { const c = s.settings.criteria; c[ds.crit] = el.type === 'checkbox' ? el.checked : (ds.crit === 'minRate' ? clamp(num(el.value), 0, 100) : Math.max(0, int(el.value))); }); toast('Kriter kaydedildi.', 'good', 1400); return; }
  if (ds.pomo) { const lim = { work: [5, 120], brk: [1, 60], long: [1, 90], every: [2, 10] }[ds.pomo]; commit(s => { s.settings.pomodoro[ds.pomo] = clamp(int(el.value) || lim[0], lim[0], lim[1]); }); toast('Pomodoro ayarı kaydedildi.', 'good', 1400); return; }
  if (el.matches('[data-intervals]')) {
    const arr = el.value.split(/[,;\s]+/).map(x => int(x)).filter(x => x > 0 && x <= 365);
    if (!arr.length) { toast('En az bir geçerli aralık gir (ör. 1, 3, 7, 14, 30).', 'error'); el.value = S.settings.intervals.join(', '); return; }
    commit(s => { s.settings.intervals = arr.slice(0, 12); }); toast('Tekrar aralıkları kaydedildi.', 'good'); return;
  }
  if (el.matches('[data-restore]')) { const f = el.files[0]; el.value = ''; if (f) restoreFile(f); return; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.matches('[data-chkadd]')) {
    e.preventDefault(); const id = f.dataset.chkadd; const v = f.t.value.trim(); if (!v) return;
    const n = N(id).node; if ((n.list || []).includes(v) || (topicGet(id).extra || []).some(x => x.t === v)) { toast('Bu başlık zaten var.'); return; }
    commit(s => { const t = T(id); t.extra = (t.extra || []).concat({ t: v.slice(0, 120) }); }); toast('Başlık eklendi.', 'good', 1500);
  }
});
window.addEventListener('beforeunload', e => { if (Store.pending()) { Store.flush(); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Store.dirty) Store.flush(); });

/* ---------- başlatma ---------- */
function onStoreReady(info) {
  if (info.needConfig) return fbConfigScreen(info.error);
  if (info.needLogin) return fbLoginScreen();
  if (info.sdkError) return fbSdkErrorScreen(info.sdkError);
  if (info.fatal) return fbFatalScreen(info.fatal, info.message);
  if (info.waiting && !READY && FIREBASE) {
    $('#view').innerHTML = `<div class="loading"><div style="max-width:420px"><div class="spinner"></div><b>Bulut verilerine ulaşılıyor…</b><p class="small">Bu cihazda ilk kez giriş yapıyorsan verilerin indirilmesi için internet bağlantısı gerekir. Bağlantı gelince sayfa kendiliğinden açılır.</p><button class="btn" onclick="location.reload()">Yenile</button></div></div>`;
    return;
  }
  if (info.waiting && !READY) {
    $('#view').innerHTML = `<div class="loading"><div style="max-width:420px"><div class="spinner"></div><b>Bulut verilerine ulaşılıyor…</b><p class="small">Bağlantı yavaş olabilir. Beklemeye devam edebilir ya da bu oturumda yalnızca bu tarayıcıda çalışabilirsin (yerel modda girdiğin veriler buluta aktarılmaz; yedekle taşıyabilirsin).</p><button class="btn" id="go-local">Yerel modda devam et</button></div></div>`;
    $('#go-local').addEventListener('click', () => { try { Store.unsub && Store.unsub(); } catch (e) { } Store.initLocal(onStoreReady, 'Kullanıcı yerel modu seçti'); });
    return;
  }
  if (READY && !info.empty) { render(); return; }
  if (info.empty) {
    S = defaultState(); bump();
    const local = info.local;
    READY = true; document.body.classList.remove('pre'); applyTheme(); Store.changed(); render();
    if (local && Array.isArray(local.logs) && (local.logs.length || (local.exams || []).length)) {
      confirmDlg({ title: 'Bu tarayıcıda kayıtlı veriler bulundu', text: `<p>Daha önce yerel modda girilmiş ${local.logs.length} kayıt ve ${(local.exams || []).length} deneme var. Bunları bulut hesabına aktarmak ister misin?</p>`, ok: 'Buluta aktar' })
        .then(ok => { if (!ok) return; S = normalizeState(local); bump(); Store.changed(); render(); toast('Yerel veriler buluta aktarıldı.', 'good'); });
    }
    return;
  }
  READY = true; document.body.classList.remove('pre'); applyTheme(); render();
}
function registerSW() {
  if (!FIREBASE || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
function boot() {
  try { const t = localStorage.getItem('dgs-theme'); if (t) S.settings.theme = t; } catch (e) { }
  applyTheme(); shell(); document.body.classList.add('pre'); UI.load(); Timer.load(); renderNav(); updateSync(); updateTimerUI();
  Store.listeners.push(updateSync);
  Store.init(onStoreReady);
  registerSW();
}
boot();
</script>
</body>
</html>
