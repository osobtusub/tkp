<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGS Takip · Hazırlık ve İlerleme Paneli</title>
<meta name="theme-color" content="#141c2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233d64c4'/%3E%3Cstop offset='1' stop-color='%231f3b73'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Arial,sans-serif' font-size='22' font-weight='800' fill='white' text-anchor='middle'%3EDGS%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DGS Takip">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f2f4f8; --surface-3:#e9edf4;
  --border:#e1e6ee; --border-2:#cfd6e2;
  --text:#141a26; --text-2:#465064; --muted:#7a8496;
  --accent:#1f3b73; --accent-2:#2c4f94; --accent-ink:#ffffff; --accent-soft:#e7edf8; --accent-text:#1f3b73;
  --nav:#141c2e; --nav-2:#1b2540; --nav-text:#c6cede; --nav-muted:#7e8aa3; --nav-active:#ffffff;
  --say:#2a78d6; --soz:#1baf7a; --say-soft:#e3eefb; --soz-soft:#e1f5ed;
  --good:#0ca30c; --good-text:#0a7a0a; --good-soft:#e5f5e5;
  --warn:#fab219; --warn-text:#8a5a00; --warn-soft:#fdf3dc;
  --serious:#ec835a; --crit:#d03b3b; --crit-text:#b42c2c; --crit-soft:#fbe7e7;
  --info-soft:#e7edf8; --info-text:#1f3b73;
  --grid:#e6e9ef; --axis:#c3c8d2; --tick:#7a8496;
  --heat0:#eef1f6; --heat1:#cde2fb; --heat2:#86b6ef; --heat3:#3987e5; --heat4:#1c5cab;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.18);
  --r:14px; --r-sm:10px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d111b; --surface:#161b26; --surface-2:#1c2230; --surface-3:#242b3b;
  --border:#283041; --border-2:#353e52;
  --text:#e8ebf2; --text-2:#b3bbca; --muted:#7f8899;
  --accent:#3d64c4; --accent-2:#4c74d6; --accent-ink:#ffffff; --accent-soft:#1d2a47; --accent-text:#8fb0f2;
  --nav:#0a0e17; --nav-2:#141b2b; --nav-text:#b9c2d3; --nav-muted:#6f7a90; --nav-active:#ffffff;
  --say:#3987e5; --soz:#199e70; --say-soft:#17263d; --soz-soft:#13302a;
  --good:#0ca30c; --good-text:#3fcf3f; --good-soft:#132a17;
  --warn:#fab219; --warn-text:#f5c45a; --warn-soft:#2e2611;
  --crit:#e05555; --crit-text:#f08383; --crit-soft:#341a1c;
  --info-soft:#1d2a47; --info-text:#8fb0f2;
  --grid:#242b39; --axis:#3a4356; --tick:#848da0;
  --heat0:#1c2230; --heat1:#184f95; --heat2:#256abf; --heat3:#3987e5; --heat4:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13.5px}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:15px;height:15px} svg.ic.lg{width:22px;height:22px}

/* ---------- yerleşim ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--nav);color:var(--nav-text);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#3d64c4,#1f3b73);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:14.5px} .brand span{font-size:11.5px;color:var(--nav-muted)}
.nav{padding:6px 10px 16px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--nav-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--nav-text);font-size:13.8px;font-weight:500}
.nav a:hover{background:var(--nav-2);color:#fff}
.nav a.on{background:var(--nav-2);color:var(--nav-active);box-shadow:inset 3px 0 0 #5b8def}
.nav a .cnt{margin-left:auto;font-size:11px;background:#d03b3b;color:#fff;border-radius:20px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:14px 18px;font-size:11.5px;color:var(--nav-muted);border-top:1px solid rgba(255,255,255,.06)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 22px;min-height:58px}
.top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.menu-btn{display:none}
.content{padding:22px;max-width:1320px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--text-2)}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--accent-text)}

/* ---------- kartlar ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card+.card{margin-top:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{display:flex;align-items:center;gap:8px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.mt{margin-top:14px} .mt-s{margin-top:8px} .mb{margin-bottom:14px}
.sep{height:1px;background:var(--border);margin:14px 0}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--text-2);margin-top:2px}
.kpi.say{border-top:3px solid var(--say)} .kpi.soz{border-top:3px solid var(--soz)}
.hero{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-.03em;line-height:1}
.count-card{background:linear-gradient(135deg,#1f3b73,#14264d);color:#fff;border:none}
.count-card .muted{color:#aebbd6}
:root[data-theme="dark"] .count-card{background:linear-gradient(135deg,#223f80,#121f3d)}

/* ---------- ilerleme ---------- */
.bar{height:8px;background:var(--surface-3);border-radius:8px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.bar.say>i{background:var(--say)} .bar.soz>i{background:var(--soz)} .bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.crit>i{background:var(--crit)}
.bar.thin{height:5px}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.goal .gl{font-size:13px;color:var(--text-2)} .goal .gv{font-size:12.5px;font-weight:600;text-align:right}
.goal .bar{grid-column:1/-1}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring>span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- butonlar & formlar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 13px;min-height:38px;cursor:pointer;font-weight:550;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 40%,var(--border))}
.btn.danger.solid{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:32px;height:32px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;color:var(--text-2);font-weight:550}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .err{font-size:12px;color:var(--crit-text)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],select,textarea{width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:8px 11px;min-height:40px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-2) 22%,transparent)}
input.bad{border-color:var(--crit)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.qgrid{margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qgrid input{text-align:center;font-weight:650;font-size:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12.8px;font-weight:550;color:var(--text-2);min-height:30px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}
.tb-sp{flex:1}
.toolbar select,.toolbar input{width:auto;min-height:36px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}

/* ---------- rozetler ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.8px;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);white-space:nowrap;line-height:1.5}
.chip.good{background:var(--good-soft);color:var(--good-text);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn-text);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit-text);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info-text);border-color:transparent}
.chip.say{background:var(--say-soft);color:var(--say);border-color:transparent} .chip.soz{background:var(--soz-soft);color:var(--soz);border-color:transparent}
:root:not([data-theme="dark"]) .chip.soz{color:#0f7a54}
.chip.opt{border-style:dashed}
.dot-i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st-baslanmadi{background:var(--surface-3)} .st-calisiliyor{background:#86b6ef} .st-ogrenildi{background:#3987e5} .st-pratik{background:#6250d6} .st-tekrar{background:var(--warn)} .st-tamamlandi{background:var(--good)}

/* ---------- tablolar ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.2px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.8px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.tot td{font-weight:700;background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tbl .act{white-space:nowrap;text-align:right;width:1%}
.link{cursor:pointer;color:var(--accent-text);font-weight:550}
.link:hover{text-decoration:underline}

/* ---------- liste ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);min-width:0}
.li:last-child{border-bottom:0}
.li .main-t{flex:1;min-width:0}
.li .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.clk{cursor:pointer;border-radius:8px}
.li.clk:hover{background:var(--surface-2)}
.rank{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text-2);flex:none}

/* ---------- konu ağacı ---------- */
.tree{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);min-height:48px}
.tn:last-child{border-bottom:0}
.tn.d0{background:var(--surface-2);font-weight:700}
.tn.d1{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.tn .tg{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:var(--muted);border:0;background:transparent}
.tn .tg:hover{background:var(--surface-3)}
.tn .tg svg{transition:transform .15s}
.tn.open>.tg svg{transform:rotate(90deg)}
.tn .tg.leaf{cursor:default}
.tn .nm{min-width:0;display:flex;flex-direction:column;gap:3px}
.tn .nm a{color:var(--text);font-weight:inherit;overflow:hidden;text-overflow:ellipsis}
.tn .nm a:hover{color:var(--accent-text)}
.tn .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.8px;color:var(--muted)}
.tn .rt{display:flex;align-items:center;gap:10px}
.tn .pw{width:120px;display:flex;align-items:center;gap:8px}
.tn .pw .bar{flex:1}
.tn .pw span{font-size:12px;font-weight:650;width:38px;text-align:right}
.tn.never .nm a::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:7px;vertical-align:middle}
.tn select.stsel{width:auto;min-height:32px;padding:4px 8px;font-size:12.5px;max-width:170px}

/* ---------- uyarı kutuları ---------- */
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;background:var(--info-soft);color:var(--info-text);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn-text)} .note.crit{background:var(--crit-soft);color:var(--crit-text)} .note.good{background:var(--good-soft);color:var(--good-text)}
.note svg{margin-top:1px}
.note b{font-weight:650}
.sugg{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13.3px;cursor:pointer}
.sugg:last-child{border-bottom:0}
.sugg .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.sugg .ico.crit{background:var(--crit-soft);color:var(--crit-text)} .sugg .ico.warn{background:var(--warn-soft);color:var(--warn-text)} .sugg .ico.info{background:var(--info-soft);color:var(--info-text)} .sugg .ico.good{background:var(--good-soft);color:var(--good-text)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.empty.small{padding:14px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px}

/* ---------- grafik ---------- */
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--tick);font-size:11px;font-family:var(--font)}
.chart .ref{stroke:var(--text-2);stroke-width:1.5;stroke-dasharray:5 4}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .cross{stroke:var(--axis);stroke-width:1;opacity:0}
.chart .xh.on .cross{opacity:1}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .donut-v{fill:var(--text);font-size:20px;font-weight:700;font-family:var(--font)}
.chart .seg{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--text-2);border-radius:0;width:14px}
.tooltip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12.3px;min-width:140px;display:none}
.tt-h{font-weight:650;margin-bottom:4px;color:var(--text)}
.tt-r{display:flex;align-items:center;gap:7px;color:var(--text-2);padding:1px 0}
.tt-r i{width:9px;height:9px;border-radius:3px;flex:none} .tt-r i.none{background:transparent}
.tt-r b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;padding-left:12px}

/* ---------- takvim ---------- */

function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}

function parseCurriculum(dsl) {
  const roots = [];
  const seen = new Set();
  let sec = null, ders = null, ana = null;
  const mk = (rawName, pathParts) => {
    let name = rawName.trim(), opt = false, note = '', list = [];
    const ci = name.indexOf('::');
    if (ci >= 0) { list = name.slice(ci + 2).split(';').map(s => s.trim()).filter(Boolean); name = name.slice(0, ci).trim(); }
    const ni = name.indexOf('@');
    if (ni >= 0) { note = name.slice(ni + 1).trim(); name = name.slice(0, ni).trim(); }
    // note may also follow the checklist
    if (list.length) {
      const last = list[list.length - 1]; const j = last.indexOf('@');
      if (j >= 0) { note = last.slice(j + 1).trim(); list[list.length - 1] = last.slice(0, j).trim(); }
    }
    if (name.startsWith('?')) { opt = true; name = name.slice(1).trim(); }
    let id = 'k' + hashStr(pathParts.concat(name).join('>'));
    while (seen.has(id)) id += 'x';
    seen.add(id);
    const node = { id, name, ch: [] };
    if (opt) node.opt = true;
    if (note || CURRICULUM_NOTES[name]) node.note = note || CURRICULUM_NOTES[name];
    if (list.length) node.list = list;
    return node;
  };
  for (const raw of dsl.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('### ')) {
      ana = mk(line.slice(4), [sec.name, ders.name]); ders.ch.push(ana);
    } else if (line.startsWith('## ')) {
      ders = mk(line.slice(3), [sec.name]); sec.ch.push(ders); ana = null;
    } else if (line.startsWith('# ')) {
      sec = mk(line.slice(2), []); roots.push(sec); ders = null; ana = null;
    } else if (line.startsWith('- ')) {
      const parent = ana || ders;
      const n = mk(line.slice(2), [sec.name, ders.name].concat(ana ? [ana.name] : []));
      parent.ch.push(n);
    }
  }
  return roots;
}

  if (d >= S.settings.staleDays * 2) return { k: 'unutma', label: 'Tekrar zamanı', cls: 'warn' };
  if (r < 80) return { k: 'gelisiyor', label: 'Gelişiyor', cls: 'info' };
  return { k: 'iyi', label: 'İyi durumda', cls: 'good' };
}
function priorityScore(id) {
  const st = stat(id); const r = rate(st) ?? 0; const d = daysSince(st.last) ?? 0;
  const lb = wilsonLB(r / 100, st.q) * 100;
  const rv = revOf(id); const overdue = rv && rv.active && rv.next && rv.next < today() ? 12 : 0;
  return (100 - lb) + Math.min(d, 60) * 0.6 + overdue;
}

/* ---------- günlük seriler ---------- */
function dayAgg(k, secFilter) {
  const a = emptyStat();
  for (const l of idx().byDay.get(k) || []) if (!secFilter || secKey(l.t) === secFilter) addStat(a, l);
  return a;
}
function rangeAgg(from, to, secFilter) {
  const a = emptyStat();
  for (const l of S.logs) if (l.d >= from && l.d <= to && N(l.t) && (!secFilter || secKey(l.t) === secFilter)) addStat(a, l);
  return a;
}
function daysRange(from, to) { const out = []; for (let k = from; k <= to; k = addDays(k, 1)) out.push(k); return out; }

function studyDays() {
  const set = new Set();
  for (const l of S.logs) if ((l.q || 0) > 0 || (l.m || 0) > 0) set.add(l.d);
  for (const e of S.exams) set.add(e.d);
  for (const r of S.revlog) set.add(r.d);
  return set;
}
function streakInfo() {
  const set = studyDays(); const t = today();
  let cur = 0; let k = set.has(t) ? t : addDays(t, -1);
  while (set.has(k)) { cur++; k = addDays(k, -1); }
  const days = Array.from(set).sort(); let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev && diffDays(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  best = Math.max(best, S.meta.records?.bestStreak || 0);
  return { cur, best, todayDone: set.has(t), total: set.size };
}

/* ---------- hedef ilerlemesi ---------- */
function goalStatus(k = today()) {
  const g = S.settings.goals; const d = dayAgg(k);
  const ws = weekStart(k), we = addDays(ws, 6);
  const w = rangeAgg(ws, we);
  const mStart = k.slice(0, 8) + '01'; const md = new Date(parseD(k).getFullYear(), parseD(k).getMonth() + 1, 0).getDate();
  const m = rangeAgg(mStart, k.slice(0, 8) + pad(md));
  const topicsDone = Object.values(S.topics).filter(t => t.status === 'tamamlandi' && t.doneAt === k).length;
  const monthlyQ = int(g.monthlyQ) || int(g.dailyQ) * md;
  return {
    day: d, week: w, month: m, topicsDone, monthlyQ,
    say: dayAgg(k, 'say'), soz: dayAgg(k, 'soz')
  };
}
function weekHit(ws) { const g = int(S.settings.goals.weeklyQ); if (!g) return null; return rangeAgg(ws, addDays(ws, 6)).q >= g; }
function monthHit(mk) {
  const [y, mo] = mk.split('-').map(Number); const md = new Date(y, mo, 0).getDate();
  const goal = int(S.settings.goals.monthlyQ) || int(S.settings.goals.dailyQ) * md; if (!goal) return null;
  return rangeAgg(mk + '-01', mk + '-' + pad(md)).q >= goal;
}

/* ---------- tekrar sistemi ---------- */
function reviewItems() {
  const out = [];
  for (const [id, t] of Object.entries(S.topics)) {
    if (!t.rev || !t.rev.active || !t.rev.next || !N(id)) continue;
    out.push({ id, next: t.rev.next, stage: t.rev.stage || 0, d: diffDays(today(), t.rev.next) });

}
function reviewBuckets() {

/* ---------- genel özetler ---------- */
function overview(secId) {
  const ids = secId ? [secId] : roots();
  const st = emptyStat(); ids.forEach(i => mergeStat(st, stat(i)));
  let leaves = [];

function personalRecords() {

/* ---------- akıllı öneriler ---------- */
function smartSuggestions(limit = 6) {
  const out = []; const ms = S.settings.minSample; const t = today();
  const rb = reviewBuckets();
  if (rb.overdue.length) out.push({ cls: 'crit', icon: 'repeat', text: `${rb.overdue.length} gecikmiş tekrarın var. En eskisi: ${esc(pathStr(rb.overdue[0].id, 2))} (${relDay(rb.overdue[0].next)}).`, go: 'tekrar' });

  const leaves = [];
  for (const [id, inf] of idx().nodes) if (inf.leaf && inf.agg.q) leaves.push(id);
  const stale = leaves.filter(id => { const st = stat(id); return st.q >= ms && rate(st) < 70 && daysSince(st.last) >= 7; })
    .sort((a, b) => priorityScore(b) - priorityScore(a));

  }

  for (const id of weak.slice(0, 2)) out.push({ cls: 'crit', icon: 'target', text: `<b>${esc(N(id).node.name)}</b>: ${fmtNum(stat(id).q)} soru çözmene rağmen başarı ${fmtPct(rate(stat(id)))}. Soru çözmeye ara verip konu tekrarı yapmayı dene.`, go: 'konu-' + id });
  const ws = weekStart(t); const w = rangeAgg(ws, t); const wSay = rangeAgg(ws, t, 'say').q, wSoz = rangeAgg(ws, t, 'soz').q;
  if (w.q >= 100) {
    const share = wSay / w.q;
    if (share > 0.8) out.push({ cls: 'info', icon: 'scale', text: `Bu hafta soruların ${fmtPct(share * 100)}'i sayısal. Sözel bölümü de ihmal etme.`, go: 'sozel' });

  }
  const ov = overview();
  if (ov.notStarted > 0 && S.logs.length > 0) {
    const dersList = []; for (const r of S.tree) for (const d of r.ch) { if (N(d.id).opt) continue; const p = prog(d.id); const ns = p.total - p.started; if (ns) dersList.push({ d, ns }); }
    dersList.sort((a, b) => b.ns - a.ns);

  return out.slice(0, limit);
}

/* ---------- yedek birleştirme ----------
   Mevcut veriler korunur; yedekte olup burada olmayan kayıtlar eklenir.
   Aynı kimlikli kayıt iki tarafta da varsa mevcut olan geçerli sayılır. */
function mergeState(cur, inc) {
  const out = JSON.parse(JSON.stringify(cur)); const added = { logs: 0, exams: 0, mistakes: 0, plans: 0, sources: 0, revlog: 0, topics: 0, nodes: 0 };
  for (const k of ['logs', 'exams', 'mistakes', 'plans', 'sources', 'revlog']) {
    const ids = new Set(out[k].map(x => x.id));
    for (const x of inc[k] || []) if (x && x.id && !ids.has(x.id)) { out[k].push(x); ids.add(x.id); added[k]++; }
  }
  // müfredat: yedekte olup burada olmayan konular üst başlıklarının altına eklenir
  const find = (id, list) => { for (const n of list) { if (n.id === id) return n; const r = find(id, n.ch || []); if (r) return r; } return null; };
  const walk = (n, parentId) => {
    if (!find(n.id, out.tree)) {
      const copy = JSON.parse(JSON.stringify(n)); const cnt = x => 1 + (x.ch || []).reduce((a, c) => a + cnt(c), 0);
      if (parentId) { const p = find(parentId, out.tree); if (!p) return; (p.ch = p.ch || []).push(copy); } else out.tree.push(copy);
      added.nodes += cnt(copy); return;
    }
    (n.ch || []).forEach(c => walk(c, n.id));
  };
  (inc.tree || []).forEach(r => walk(r, null));
  const W = k => STATUS[k || 'baslanmadi']?.w ?? 0;
  for (const [id, t] of Object.entries(inc.topics || {})) {
    const c = out.topics[id];
    if (!c) { out.topics[id] = t; added.topics++; continue; }
    if (W(t.status) > W(c.status)) { c.status = t.status; if (t.doneAt) c.doneAt = t.doneAt; }
    if (t.lecture) c.lecture = true;
    if (!c.target && t.target) c.target = t.target;
    if (t.notes && t.notes !== c.notes) c.notes = c.notes ? (c.notes.includes(t.notes) ? c.notes : c.notes + '\n\n' + t.notes) : t.notes;
    if (t.chk) c.chk = Array.from(new Set((c.chk || []).concat(t.chk)));
    if (t.extra) { const have = new Set((c.extra || []).map(e => e.t)); c.extra = (c.extra || []).concat(t.extra.filter(e => !have.has(e.t))); }
    if (t.rev && (!c.rev || (!c.rev.active && t.rev.active))) c.rev = t.rev;
    if (!c.crit && t.crit) c.crit = t.crit;
  }
  for (const [k, d] of Object.entries((inc.meta && inc.meta.ach) || {})) if (!out.meta.ach[k] || d < out.meta.ach[k]) out.meta.ach[k] = d;
  out.meta.records.bestStreak = Math.max(out.meta.records.bestStreak || 0, (inc.meta && inc.meta.records && inc.meta.records.bestStreak) || 0);
  return { state: out, added };
}

/* ---------- ağaç işlemleri ---------- */
function findNode(id, list = S.tree, parent = null) {
  for (const n of list) { if (n.id === id) return { node: n, parent, list }; const r = findNode(id, n.ch || [], n); if (r) return r; }
  return null;
}
function descendants(id) { const out = []; const f = findNode(id); if (!f) return out; const walk = n => { out.push(n.id); (n.ch || []).forEach(walk); }; walk(f.node); return out; }
/* ==========================================================================
   KALICI DEPOLAMA
   - Bulut modu: Claude artifact "db" yeteneği; veriler hesabına özel
     data/users/<id>/ altında belge kovaları olarak saklanır. Aynı hesapla
     açılan her cihazda aynı veriler görünür (canlı senkronizasyon).
   - Yerel mod: db kullanılamazsa (oturum kapalı, önizleme vb.) tarayıcı

const STANDALONE = !!window.DGS_STANDALONE;

/* Yerel modda fotoğraflar IndexedDB'de tutulur (localStorage kotası küçüktür) */
const IDB = {
  p: null,
  open() {
    if (!this.p) this.p = new Promise((res, rej) => {
      try { const r = indexedDB.open('dgs-takip', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return this.p;
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('img', mode); const r = fn(t.objectStore('img')); t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  get(id) { return this.run('readonly', s => s.get(id)); },
  put(id, v) { return this.run('readwrite', s => s.put(v, id)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); }
};
const LS_IMG = 'dgs-img-';
const DOC_LIMIT = 170 * 1024; // UTF-8 bayt (belge sınırı 256 KiB)
const byteLen = s => { let n = s.length; for (let i = 0; i < s.length; i++) if (s.charCodeAt(i) > 127) n += 2; return n; };

function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

const Store = {
  mode: 'loading',          // loading | cloud | local
  status: 'idle',           // idle | saving | saved | error | offline
  statusMsg: '',
  db: null, uid: null, col: null, media: null,
  last: {},                 // belge kimliği -> son yazılan/okunan stabil JSON
  remote: {},               // belge kimliği -> veri
  dirty: false, timer: null, flushing: false, again: false, retry: null,
  imgCache: new Map(),
  listeners: [],

  setStatus(s, msg = '') { this.status = s; this.statusMsg = msg; this.listeners.forEach(f => f()); },

  /* ---- belge eşlemesi ---- */
  toDocs(st) {
    const docs = {};
    const chunk = (kind, bucket, items, isMap) => {
      const entries = isMap ? Object.entries(items) : items;
      let part = [], size = 0, n = 0;
      const emit = () => {
        const id = kind + (bucket ? '_' + bucket : '') + '_' + n++;
        docs[id] = isMap ? { k: kind, entries: Object.fromEntries(part) } : { k: kind, items: part };
        part = []; size = 0;
      };
      for (const e of entries) {
        const s = byteLen(JSON.stringify(e)) + 2;
        if (part.length && size + s > DOC_LIMIT) emit();
        part.push(e); size += s;
      }
      if (part.length || n === 0) emit();
    };
    docs['settings_0'] = { k: 'settings', v: st.settings };
    docs['meta_0'] = { k: 'meta', v: st.meta };
    chunk('tree', '', st.tree, false);
    chunk('topics', '', st.topics, true);
    chunk('sources', '', st.sources, false);
    const bucketize = (kind, arr, f) => {
      const g = {}; for (const x of arr) { const b = f(x); (g[b] = g[b] || []).push(x); }
      for (const [b, items] of Object.entries(g)) chunk(kind, b, items, false);
    };
    bucketize('logs', st.logs, x => x.d.slice(0, 7));
    bucketize('exams', st.exams, x => x.d.slice(0, 4));
    bucketize('mistakes', st.mistakes, x => x.d.slice(0, 7));
    bucketize('plans', st.plans, x => x.d.slice(0, 7));
    bucketize('revlog', st.revlog, x => x.d.slice(0, 4));
    return docs;
  },
  fromDocs(docs) {
    const st = { tree: [], topics: {}, sources: [], logs: [], exams: [], mistakes: [], plans: [], revlog: [] };
    const sorted = Object.entries(docs).sort((a, b) => a[0].localeCompare(b[0], 'en', { numeric: true }));

const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- bildirim ---------- */
function toast(msg, type = '', ms = 3200) {
  let box = $('.toasts'); if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + type; t.setAttribute('role', 'status');
  t.innerHTML = (type === 'error' ? ic('alert') : type === 'good' ? ic('check') : ic('info')) + `<span>${msg}</span>`;
  box.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, ms);
}

/* ---------- modal ---------- */
const Modals = [];
function openModal({ title, body, foot = '', wide = false, onMount, onClose, cls = '' }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Kapat">${ic('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(bg);
  document.body.style.overflow = 'hidden';
  const m = { el: bg, close: () => { bg.remove(); const i = Modals.indexOf(m); if (i >= 0) Modals.splice(i, 1); if (!Modals.length) document.body.style.overflow = ''; onClose && onClose(); } };
  Modals.push(m);
  bg.addEventListener('mousedown', e => { if (e.target === bg) bg._down = true; });
  bg.addEventListener('click', e => { if (e.target === bg && bg._down) m.close(); bg._down = false; if (e.target.closest('[data-close]')) m.close(); });
  onMount && onMount(bg.querySelector('.modal'), m);
  const f = bg.querySelector('input:not([type=checkbox]):not([type=hidden]),select,textarea');
  if (f && window.innerWidth > 720) setTimeout(() => { if (!bg.contains(document.activeElement)) f.focus(); }, 30);
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modals.length) Modals[Modals.length - 1].close(); });

function confirmDlg({ title = 'Emin misin?', text = '', ok = 'Onayla', danger = false, cancel = 'Vazgeç', typeToConfirm = '', extraBtn = null }) {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title, body: `<div>${text}</div>${typeToConfirm ? `<div class="field mt"><label>Onaylamak için <b>${esc(typeToConfirm)}</b> yaz</label><input type="text" id="cf-type" autocomplete="off"></div>` : ''}`,
      foot: `<button class="btn" data-r="0">${esc(cancel)}</button>${extraBtn ? `<button class="btn" data-r="extra">${esc(extraBtn)}</button>` : ''}<button class="btn ${danger ? 'danger solid' : 'primary'}" data-r="1" ${typeToConfirm ? 'disabled' : ''}>${esc(ok)}</button>`,
      onMount: (el) => {
        const okb = el.querySelector('[data-r="1"]');
        if (typeToConfirm) el.querySelector('#cf-type').addEventListener('input', e => { const norm = x => x.trim().toLocaleUpperCase('tr').replace(/İ/g, 'I'); okb.disabled = norm(e.target.value) !== norm(typeToConfirm); });
        el.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { done = true; const r = b.dataset.r; m.close(); res(r === '1' ? true : r === 'extra' ? 'extra' : false); }));
      },
      onClose: () => { if (!done) res(false); }
    });
  });
}

const progBar = (pct, cls = '') => `<div class="bar ${cls}"><i style="width:${clamp(pct || 0, 0, 100).toFixed(1)}%"></i></div>`;
const statusChip = k => { const s = STATUS[k] || STATUS.baslanmadi; const cls = k === 'tamamlandi' ? 'good' : k === 'tekrar' ? 'warn' : k === 'baslanmadi' ? '' : 'info'; return `<span class="chip ${cls}"><i class="dot-i st-${k}"></i>${s.label}</span>`; };
const secChip = id => { const k = secKey(id); return k === 'say' ? '<span class="chip say">Sayısal</span>' : k === 'soz' ? '<span class="chip soz">Sözel</span>' : ''; };
const rateChip = st => { const r = rate(st); if (r == null) return '<span class="chip">—</span>'; if (!reliable(st)) return `<span class="chip" title="Az veri: ${st.q} soru">${fmtPct(r)}*</span>`; return `<span class="chip ${r >= 75 ? 'good' : r >= 55 ? 'warn' : 'crit'}">${fmtPct(r)}</span>`; };
const kpi = (l, v, s = '', cls = '') => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v num">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const emptyBox = (t, s = '', btn = '') => `<div class="empty"><b>${t}</b>${s}${btn ? `<div class="mt-s">${btn}</div>` : ''}</div>`;
const goalRow = (label, cur, goal, fmt = fmtNum, cls = '') => {
  if (!goal) return '';
  const p = goal ? cur / goal * 100 : 0;
  return `<div class="goal"><span class="gl">${label}</span><span class="gv num">${fmt(cur)} / ${fmt(goal)} · ${fmtPct(Math.min(999, p))}</span>${progBar(p, p >= 100 ? 'good' : cls)}</div>`;
};
const sel = (opts, val) => opts.map(o => `<option value="${esc(o.k)}" ${String(o.k) === String(val) ? 'selected' : ''}>${esc(o.label)}</option>`).join('');

/* konu seçici seçenekleri: dersler optgroup, ana konular "(genel)", alt konular "Ana › Alt" */
function topicOptions(selected, { sec = null, blank = 'Konu seç…', leafOnly = false } = {}) {
  let h = blank ? `<option value="">${esc(blank)}</option>` : '';
  for (const r of S.tree) {
    if (sec && secKey(r.id) !== sec) continue;
    for (const d of r.ch) {
      const label = (sec ? '' : r.name.replace(' Bölüm', '') + ' · ') + d.name;
      h += `<optgroup label="${esc(label)}">`;
      if (!leafOnly) h += `<option value="${d.id}" ${d.id === selected ? 'selected' : ''}>${esc(d.name)} — karma / genel</option>`;
      const walk = (n, prefix) => {
        const isLeaf = !n.ch || !n.ch.length;
        if (isLeaf || !leafOnly) h += `<option value="${n.id}" ${n.id === selected ? 'selected' : ''}>${esc(prefix + n.name)}${isLeaf ? '' : ' (genel)'}</option>`;
        (n.ch || []).forEach(c => walk(c, prefix + n.name + ' › '));
      };
      d.ch.forEach(c => walk(c, ''));
      h += '</optgroup>';
    }
  }
  return h;
}
function sourceOptions(selected, allowNew = true) {
  return `<option value="">Kaynak belirtme</option>` + S.sources.map(s => `<option value="${s.id}" ${s.id === selected ? 'selected' : ''}>${esc(s.name)}</option>`).join('') + (allowNew ? '<option value="__new">+ Yeni kaynak ekle…</option>' : '');
}

/* ---------- çalışma kaydı formu (modal ve satır içi ortak) ---------- */
function logFields(v = {}, { showTopic = true, sec = null, compact = false } = {}) {
  const t = v.t || '';
  return `
  ${showTopic ? `<div class="field full"><label>Konu</label><select name="t" required>${topicOptions(t, { sec })}</select></div>` : `<input type="hidden" name="t" value="${esc(t)}">`}
  <div class="qgrid">
    <div class="field"><label>Soru</label><input type="number" inputmode="numeric" min="0" name="q" value="${v.q ?? ''}" placeholder="0"></div>
    <div class="field"><label>Doğru</label><input type="number" inputmode="numeric" min="0" name="c" value="${v.c ?? ''}" placeholder="0"></div>
    <div class="field"><label>Yanlış</label><input type="number" inputmode="numeric" min="0" name="w" value="${v.w ?? ''}" placeholder="0"></div>
    <div class="field"><label>Boş</label><input type="number" inputmode="numeric" min="0" name="b" value="${v.b ?? ''}" placeholder="oto"></div>
  </div>
  <div class="small muted mt-s" data-live>Boş bırakırsan "Boş" otomatik hesaplanır (Soru − Doğru − Yanlış).</div>
  <div class="form-grid mt">
    <div class="field"><label>Tarih</label><input type="date" name="d" value="${esc(v.d || today())}" max="${today()}"></div>
    <div class="field"><label>Süre (dakika)</label><input type="number" inputmode="numeric" min="0" max="1440" name="m" value="${v.m ?? ''}" placeholder="0"></div>
    <div class="field full"><label>Kaynak</label><select name="src">${sourceOptions(v.src || '')}</select><input type="text" name="srcNew" class="hide mt-s" placeholder="Yeni kaynak adı (ör. Benim Hocam Matematik)"></div>
    ${compact ? '' : `<div class="field full"><label>Not (isteğe bağlı)</label><input type="text" name="n" value="${esc(v.n || '')}" maxlength="300" placeholder="Ör. zor sorular, eksik kalan başlık…"></div>`}
  </div>
  <div class="err small mt-s" data-err style="color:var(--crit-text)"></div>`;
}
function wireLogForm(root) {
  const g = n => root.querySelector(`[name="${n}"]`);
  const live = root.querySelector('[data-live]');
  let bTouched = g('b').value !== '';
  g('b').addEventListener('input', () => { bTouched = g('b').value !== ''; upd(); });
  const upd = () => {
    const q = int(g('q').value), c = int(g('c').value), w = int(g('w').value);
    if (!bTouched && g('q').value !== '' && q - c - w >= 0) g('b').placeholder = String(q - c - w);
    const b = bTouched ? int(g('b').value) : Math.max(0, q - c - w);
    const tot = g('q').value !== '' ? q : c + w + b;
    if (tot > 0) {
      const ok = c + w + b === tot;
      const r = S.settings.successMode === 'net' ? Math.max(0, netOf(c, w)) / tot * 100 : c / tot * 100;
      live.innerHTML = ok ? `Toplam <b>${tot}</b> · Doğru ${fmtPct(c / tot * 100)} · Yanlış ${fmtPct(w / tot * 100)} · Net <b>${fmtNet(netOf(c, w))}</b> · Başarı <b>${fmtPct(r)}</b>`
        : `<span style="color:var(--crit-text)">Doğru + Yanlış + Boş (${c + w + b}) soru sayısına (${tot}) eşit olmalı.</span>`;
    } else live.textContent = 'Boş bırakırsan "Boş" otomatik hesaplanır (Soru − Doğru − Yanlış).';
  };
  ['q', 'c', 'w'].forEach(n => g(n).addEventListener('input', upd));
  g('src').addEventListener('change', () => g('srcNew').classList.toggle('hide', g('src').value !== '__new'));
  upd();
}
function readLogForm(root) {
  const g = n => root.querySelector(`[name="${n}"]`);
  const err = m => { root.querySelector('[data-err]').textContent = m; return null; };
  const t = g('t').value; if (!t || !N(t)) return err('Lütfen bir konu seç.');
  const raw = n => g(n).value.trim();
  for (const n of ['q', 'c', 'w', 'b', 'm']) if (raw(n) !== '' && (!/^\d+$/.test(raw(n)))) return err('Sayı alanlarına yalnızca 0 veya pozitif tam sayı girilebilir.');
  let q = int(raw('q')), c = int(raw('c')), w = int(raw('w')), b = raw('b') === '' ? null : int(raw('b'));
  if (raw('q') === '') q = c + w + (b || 0);
  if (b === null) b = q - c - w;
  if (b < 0) return err(`Doğru (${c}) + Yanlış (${w}) toplamı soru sayısını (${q}) aşıyor.`);
  if (c + w + b !== q) return err(`Doğru + Yanlış + Boş (${c + w + b}) soru sayısına (${q}) eşit olmalı.`);
  if (q > 2000) return err('Tek kayıtta en fazla 2000 soru girilebilir.');
  const m = int(raw('m')); if (m > 1440) return err('Süre bir günden (1440 dk) uzun olamaz.');
  if (!q && !m) return err('Soru sayısı veya çalışma süresinden en az biri girilmeli.');
  const d = g('d').value; if (!isDKey(d)) return err('Geçerli bir tarih seç.');
  if (d > today()) return err('Gelecek tarihli kayıt girilemez.');
  let src = g('src').value;
  let newSrc = null;
  if (src === '__new') { const nm = g('srcNew').value.trim(); if (!nm) return err('Yeni kaynak adını yaz veya listeden seç.'); newSrc = { id: uid(), name: nm.slice(0, 120), sec: secKey(t), total: 0, status: 'aktif', topics: [], n: '' }; src = newSrc.id; }
  root.querySelector('[data-err]').textContent = '';
  return { t, q, c, w, b, m, d, src, newSrc, n: g('n') ? g('n').value.trim().slice(0, 300) : '' };
}
function saveLog(v, existing) {
  let autoMsg = '';
  commit(s => {
    if (v.newSrc) s.sources.push(v.newSrc);
    if (existing) {
      const l = s.logs.find(x => x.id === existing.id);
      if (l) Object.assign(l, { t: v.t, q: v.q, c: v.c, w: v.w, b: v.b, m: v.m, d: v.d, src: v.src, n: v.n });
    } else {
      s.logs.push({ id: uid(), t: v.t, q: v.q, c: v.c, w: v.w, b: v.b, m: v.m, d: v.d, src: v.src, n: v.n, ts: Date.now() });
      const tp = T(v.t);
      if (S.settings.autoStatus && N(v.t)?.leaf && (!tp.status || tp.status === 'baslanmadi')) { tp.status = 'calisiliyor'; autoMsg = ' Durum: Çalışılıyor.'; }
      if (v.review && !(tp.rev && tp.rev.active)) { tp.rev = { stage: 0, active: true, next: addDays(v.d > today() ? v.d : today(), S.settings.intervals[0] || 1), hist: [] }; autoMsg += ' Tekrar planlandı.'; }
    }
  });
  maybeAutoComplete(v.t);
  const r = v.q ? (S.settings.successMode === 'net' ? Math.max(0, netOf(v.c, v.w)) : v.c) / v.q * 100 : null;
  toast((existing ? 'Kayıt güncellendi' : 'Kayıt eklendi') + (v.q ? `: ${v.q} soru · başarı ${fmtPct(r)}` : `: ${fmtMin(v.m)}`) + '.' + autoMsg, 'good');
}
function maybeAutoComplete(id) {
  if (!S.settings.criteria.autoComplete) return;
  const inf = N(id); if (!inf || !inf.leaf) return;
  const cc = criteriaCheck(id);
  if (cc.enabled && cc.ok && cc.items.length && topicGet(id).status !== 'tamamlandi') {
    commit(s => { const t = T(id); t.status = 'tamamlandi'; t.doneAt = today(); });
    toast(`"${esc(inf.node.name)}" tamamlama kriterlerini karşıladı ve Tamamlandı olarak işaretlendi.`, 'good', 4500);
  }
}
function openLogForm({ t = '', log = null, m = null, sec = null } = {}) {
  const v = log ? { ...log } : { t, m };
  const tp = t ? topicGet(t) : null;
  const revDefault = !log && S.settings.autoReview && !(tp && tp.rev && tp.rev.active);
  const md = openModal({
    title: log ? 'Kaydı düzenle' : 'Çalışma kaydı ekle',
    body: `<form novalidate class="stack" data-logform>${logFields(v, { sec })}${log ? '' : `<label class="chk"><input type="checkbox" name="review" ${revDefault ? 'checked' : ''}> Bu konu için tekrar planla (${S.settings.intervals[0] || 1} gün sonra)</label>`}</form>`,
    foot: `${log ? `<button class="btn danger" data-del>${ic('trash', 'sm')} Sil</button><span style="flex:1"></span>` : ''}<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-save>${ic('check', 'sm')} Kaydet</button>`,
    onMount: (el, mm) => {
      const f = el.querySelector('[data-logform]'); wireLogForm(f);
      const save = () => { const r = readLogForm(f); if (!r) return; r.review = f.querySelector('[name=review]')?.checked; saveLog(r, log); mm.close(); };
      el.querySelector('[data-save]').addEventListener('click', save);
      f.addEventListener('submit', e => { e.preventDefault(); save(); });
      el.querySelector('[data-del]')?.addEventListener('click', async () => { if (await deleteLog(log.id)) mm.close(); });
    }
  });
  return md;
}
async function deleteLog(id) {
  const l = S.logs.find(x => x.id === id); if (!l) return false;
  const ok = await confirmDlg({ title: 'Kaydı sil', text: `${fmtDate(l.d, true)} tarihli <b>${esc(pathStr(l.t, 2))}</b> kaydı (${l.q} soru, ${fmtMin(l.m)}) silinsin mi? Bu işlem geri alınamaz.`, ok: 'Sil', danger: true });
  if (!ok) return false;
  commit(s => { s.logs = s.logs.filter(x => x.id !== id); });
  toast('Kayıt silindi.');
  return true;
}

/* ---------- hızlı kayıt ---------- */
function openQuickAdd() {
  let last = {}; try { last = JSON.parse(localStorage.getItem('dgs-quick') || '{}'); } catch (e) { }
  let sec = last.sec || 'say';
  const body = () => `<div class="stack" data-q>
    <div class="seg" data-secseg><button type="button" data-sec="say" class="${sec === 'say' ? 'on' : ''}">Sayısal</button><button type="button" data-sec="soz" class="${sec === 'soz' ? 'on' : ''}">Sözel</button></div>
    <form novalidate data-logform>${logFields({ t: last.t && secKey(last.t) === sec ? last.t : '', src: last.src }, { sec, compact: true })}</form></div>`;
  openModal({
    title: 'Hızlı soru kaydı', body: body(),
    foot: `<button class="btn" data-again>Kaydet ve yeni</button><button class="btn primary" data-save>${ic('check', 'sm')} Kaydet</button>`,
    onMount: (el, mm) => {
      const bind = () => {
        const f = el.querySelector('[data-logform]'); wireLogForm(f);
        el.querySelectorAll('[data-sec]').forEach(b => b.addEventListener('click', () => { sec = b.dataset.sec; el.querySelector('.modal-b').innerHTML = body(); bind(); }));
        f.addEventListener('submit', e => { e.preventDefault(); go(false); });
      };
      const go = (again) => {
        const f = el.querySelector('[data-logform]'); const r = readLogForm(f); if (!r) return;
        r.review = S.settings.autoReview && !(topicGet(r.t).rev && topicGet(r.t).rev.active);
        saveLog(r, null);
        last = { sec, t: r.t, src: r.src }; try { localStorage.setItem('dgs-quick', JSON.stringify(last)); } catch (e) { }
        if (again) { el.querySelector('.modal-b').innerHTML = body(); bind(); const q = el.querySelector('[name=q]'); q && q.focus(); }
        else mm.close();
      };

/* ---------- kronometre / Pomodoro ---------- */
const Timer = {
  st: { mode: 'stop', running: false, start: 0, acc: 0, phase: 'work', cycles: 0, workAcc: 0, t: '' },
  tick: null,
  load() { try { const x = JSON.parse(localStorage.getItem('dgs-timer') || 'null'); if (x) this.st = Object.assign(this.st, x); } catch (e) { } if (this.st.running) this.loop(); },
  save() { try { localStorage.setItem('dgs-timer', JSON.stringify(this.st)); } catch (e) { } },
  elapsed() { return this.st.acc + (this.st.running ? Date.now() - this.st.start : 0); },
  phaseLen() { const p = S.settings.pomodoro; return (this.st.phase === 'work' ? p.work : (this.st.cycles > 0 && this.st.cycles % (p.every || 4) === 0 ? p.long : p.brk)) * 60000; },
  workMinutes() { const st = this.st; let ms = st.workAcc; if (st.mode === 'stop') ms = this.elapsed(); else if (st.phase === 'work') ms += this.elapsed(); return Math.round(ms / 60000); },
  display() {
    const st = this.st; let ms = this.elapsed();
    if (st.mode === 'pomo') ms = Math.max(0, this.phaseLen() - ms);
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(ss);
  },
  startPause() {
    const st = this.st;
    if (st.running) { st.acc += Date.now() - st.start; st.running = false; }
    else { st.start = Date.now(); st.running = true; }
    this.save(); this.loop(); updateTimerUI();
  },
  reset() { this.st = { mode: this.st.mode, running: false, start: 0, acc: 0, phase: 'work', cycles: 0, workAcc: 0, t: this.st.t }; this.save(); updateTimerUI(); },
  loop() {
    clearInterval(this.tick);
    if (!this.st.running) return;
    this.tick = setInterval(() => {
      if (this.st.mode === 'pomo' && this.elapsed() >= this.phaseLen()) this.nextPhase();
      updateTimerUI();
    }, 1000);
  },
  nextPhase() {
    const st = this.st;
    if (st.phase === 'work') { st.workAcc += this.phaseLen(); st.cycles++; st.phase = 'break'; toast('Pomodoro tamamlandı. Mola zamanı!', 'good', 5000); }
    else { st.phase = 'work'; toast('Mola bitti. Çalışmaya devam!', '', 5000); }
    st.acc = 0; st.start = Date.now(); this.save(); beep();
  }
};
function beep() {
  try { const A = window.AudioContext || window.webkitAudioContext; const a = new A(); const o = a.createOscillator(); const g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = 0.08; o.start(); setTimeout(() => { o.stop(); a.close(); }, 350); } catch (e) { }
  try { navigator.vibrate && navigator.vibrate(200); } catch (e) { }
}
function updateTimerUI() {
  const el = $('#timer-pill'); if (!el) return;
  const st = Timer.st; const active = st.running || st.acc > 0 || st.workAcc > 0;
  el.className = 'timer-pill' + (st.running ? (st.mode === 'pomo' && st.phase === 'break' ? ' brk' : ' run') : '');
  el.innerHTML = active
    ? `<span data-act="timer-open" style="cursor:pointer">${st.mode === 'pomo' ? (st.phase === 'work' ? 'Odak ' : 'Mola ') : ''}${Timer.display()}</span><button class="icon-btn" data-act="timer-toggle" aria-label="${st.running ? 'Duraklat' : 'Başlat'}">${ic(st.running ? 'pause' : 'play', 'sm')}</button>`
    : `<span data-act="timer-open" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center">${ic('timer', 'sm')}<span class="hide-sm">Kronometre</span></span><button class="icon-btn" data-act="timer-open" aria-label="Kronometreyi aç">${ic('play', 'sm')}</button>`;
  const big = $('#timer-big'); if (big) { big.textContent = Timer.display(); }
  const ph = $('#timer-phase'); if (ph) ph.textContent = st.mode === 'pomo' ? (st.phase === 'work' ? `Odak · ${st.cycles} pomodoro tamamlandı` : 'Mola') : 'Kronometre';
  const sp = $('#timer-sp'); if (sp) sp.innerHTML = ic(st.running ? 'pause' : 'play', 'sm') + (st.running ? ' Duraklat' : ' Başlat');
  const wm = $('#timer-wm'); if (wm) wm.textContent = fmtMin(Timer.workMinutes());
}

async function offerFile(filename, data, label) {
  let dl = null;
  try { dl = !STANDALONE && window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast(`${esc(label || filename)} indirildi.`, 'good'); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('İndirme iptal edildi.'); return false; }
      if (e && e.code === 'rate_limited') { toast('Başka bir indirme onayı açık; biraz sonra tekrar dene.'); return false; }
    }
  }
  // Yedek yol: tarayıcı indirmesi (artifact dışında) veya kopyalanabilir metin
  if (!window.claude || STANDALONE) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      toast(`${esc(filename)} indirildi.`, 'good'); return true;
    } catch (e) { }
  }
  if (typeof data === 'string') {
    openModal({
      title: 'Dosya içeriği', wide: true,
      body: `<p class="small muted">Bu görünümde doğrudan indirme kullanılamıyor. İçeriği kopyalayıp <b>${esc(filename)}</b> adıyla kaydedebilirsin.</p><textarea style="min-height:260px;font-family:ui-monospace,monospace;font-size:12px" readonly>${esc(data.length > 2000000 ? data.slice(0, 2000000) : data)}</textarea>`,
      foot: `<button class="btn" data-close>Kapat</button><button class="btn primary" data-copy>${ic('copy', 'sm')} Kopyala</button>`,
      onMount: (el) => el.querySelector('[data-copy]').addEventListener('click', async () => { try { await navigator.clipboard.writeText(data); toast('Panoya kopyalandı.', 'good'); } catch (e) { el.querySelector('textarea').select(); toast('Metni seçip elle kopyala.'); } })
    });
  } else toast('Bu görünümde dosya indirme kullanılamıyor.', 'error');
  return false;
}

/* görsel küçültme: fotoğrafı ~180 KB altına sıkıştırır */
function compressImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Lütfen bir görsel dosyası seç.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Dosya okunamadı.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Görsel açılamadı.'));
      img.onload = () => {
        let maxSide = 1400, q = 0.82, out = '';
        for (let i = 0; i < 8; i++) {
          const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 185000) break;
          if (q > 0.55) q -= 0.1; else maxSide = Math.round(maxSide * 0.8);
        }
        if (out.length > 240000) return rej(new Error('Görsel çok büyük; daha küçük bir fotoğraf dene.'));
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ==========================================================================
   FIREBASE SÜRÜMÜ — kullanıcının kendi (ücretsiz) Firebase projesiyle
   e-posta/şifre girişi ve Firestore üzerinden cihazlar arası eşitleme.
   Veriler: users/<uid>/docs (uygulama verisi), users/<uid>/img (fotoğraflar)
   ========================================================================== */
const FB_VERSION = '13.1.0';
const FB_CFG_KEY = 'dgs-fb-config';
const FB_KEYS = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
const GUIDE_URL = window.DGS_GUIDE_URL || '';

const FB = {
  cfg: null, auth: null, fs: null, user: null, loaded: false,

  /* yapıştırılan metinden (JSON veya "const firebaseConfig = {...}") yapılandırmayı çıkar */
  parseConfig(text) {
    const cfg = {};
    const t = String(text || '');
    for (const k of FB_KEYS) {
      const m = t.match(new RegExp('["\']?' + k + '["\']?\\s*:\\s*["\']([^"\']+)["\']'));
      if (m) cfg[k] = m[1].trim();
    }
    if (!cfg.apiKey || !cfg.projectId || !cfg.appId) return null;
    if (!cfg.authDomain) cfg.authDomain = cfg.projectId + '.firebaseapp.com';
    return cfg;
  },
  encodeCfg(cfg) { const s = JSON.stringify(cfg); return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  decodeCfg(s) { try { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return this.parseConfig(decodeURIComponent(escape(atob(s)))); } catch (e) { return null; } },
  appURL() { return location.origin + location.pathname.replace(/index\.html$/, ''); },
  linkURL() { return this.appURL() + '#kurulum=' + this.encodeCfg(this.cfg); },

  loadConfig() {
    // 1) diğer cihazdan gelen bağlantı  2) config.js  3) bu cihazda kayıtlı
    const h = location.hash || '';
    if (h.startsWith('#kurulum=')) {
      const c = this.decodeCfg(h.slice(9));
      history.replaceState(null, '', location.pathname + location.search);
      if (c) { try { localStorage.setItem(FB_CFG_KEY, JSON.stringify(c)); } catch (e) { } return c; }
    }
    const w = window.DGS_FIREBASE_CONFIG;
    if (w && w.apiKey && w.projectId) return w;
    try { const c = JSON.parse(localStorage.getItem(FB_CFG_KEY) || 'null'); if (c && c.apiKey) return c; } catch (e) { }
    return null;
  },
  saveConfig(cfg) { try { localStorage.setItem(FB_CFG_KEY, JSON.stringify(cfg)); return true; } catch (e) { return false; } },
  clearConfig() { try { localStorage.removeItem(FB_CFG_KEY); } catch (e) { } },

  loadSDK() {
    if (window.firebase && window.firebase.firestore && window.firebase.auth) return Promise.resolve();
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VERSION + '/';
    const one = f => new Promise((res, rej) => { const s = document.createElement('script'); s.src = base + f; s.onload = res; s.onerror = () => rej(new Error(f)); document.head.appendChild(s); });
    return Promise.race([
      one('firebase-app-compat.js').then(() => Promise.all([one('firebase-auth-compat.js'), one('firebase-firestore-compat.js')])),
      new Promise((_, rej) => setTimeout(() => rej(new Error('zaman aşımı')), 20000))
    ]);
  },
  authError(e) {
    const c = (e && e.code) || '';
    const map = {
      'auth/invalid-email': 'E-posta adresi geçersiz.',
      'auth/missing-password': 'Şifreyi yaz.',
      'auth/weak-password': 'Şifre en az 6 karakter olmalı.',
      'auth/email-already-in-use': 'Bu e-postayla zaten bir hesap var. "Giriş yap"ı kullan.',
      'auth/invalid-credential': 'E-posta veya şifre hatalı.',
      'auth/wrong-password': 'E-posta veya şifre hatalı.',
      'auth/user-not-found': 'Bu e-postayla kayıtlı hesap yok. Önce "Hesap oluştur".',
      'auth/too-many-requests': 'Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar dene.',
      'auth/network-request-failed': 'İnternet bağlantısı yok gibi görünüyor.',
      'auth/operation-not-allowed': 'Firebase projesinde "E-posta/Şifre" giriş yöntemi açık değil. Rehberdeki 3. adımı yap.',
      'auth/configuration-not-found': 'Firebase projesinde Authentication henüz başlatılmamış. Rehberdeki 3. adımı yap.',
      'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Firebase yapılandırması hatalı (apiKey). Bağlantı ayarlarını yeniden yapıştır.',
      'auth/invalid-api-key': 'Firebase yapılandırması hatalı (apiKey). Bağlantı ayarlarını yeniden yapıştır.'
    };
    return map[c] || ('Bir hata oluştu' + (c ? ' (' + c + ')' : '') + '.');
  },
  storeError(code) {
    const map = {
      'permission-denied': 'Firebase erişim izni vermedi. Firestore güvenlik kurallarını rehberdeki 4. adımdaki gibi yayınladığından emin ol.',
      'failed-precondition': 'Firestore veritabanı henüz oluşturulmamış görünüyor. Rehberdeki 4. adımı yap.',
      'not-found': 'Firestore veritabanı bulunamadı. Rehberdeki 4. adımı yap.',
      'resource-exhausted': 'Firebase\'in ücretsiz günlük kotası doldu; yarın otomatik olarak devam eder.',
      'unauthenticated': 'Oturum süresi doldu. Yeniden giriş yap.'
    };
    return map[code] || ('Bulut hatası: ' + code);
  }
};

/* ---- Store'a Firebase yöntemleri ---- */
Object.assign(Store, {
  fire: false, pendingCount: 0,
  async initFirebase(onReady) {
    this.fire = true;
    const cfg = FB.loadConfig();
    if (!cfg) return onReady({ needConfig: true });
    FB.cfg = cfg;
    try { await FB.loadSDK(); }
    catch (e) { return onReady({ sdkError: e.message || 'yüklenemedi' }); }
    try {
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
      FB.auth = firebase.auth(); FB.auth.languageCode = 'tr';
      FB.fs = firebase.firestore();
      try { if (typeof FB.fs.enablePersistence === 'function') await FB.fs.enablePersistence({ synchronizeTabs: true }).catch(() => { }); } catch (e) { }
    } catch (e) { return onReady({ needConfig: true, error: 'Firebase başlatılamadı: ' + (e.message || e) }); }
    FB.loaded = true;
    window.addEventListener('online', () => this.fireStatus());
    window.addEventListener('offline', () => this.fireStatus());
    let attached = false;
    FB.auth.onAuthStateChanged(user => {
      FB.user = user;
      if (!user) { if (attached) { location.reload(); return; } return onReady({ needLogin: true }); }
      if (attached) return;
      attached = true; this.uid = user.uid;
      this.col = FB.fs.collection('users/' + user.uid + '/docs');
      this.media = FB.fs.collection('users/' + user.uid + '/img');
      this.attach(onReady);
    });
  },
  track(p, id) {
    this.pendingCount++; this.fireStatus();
    p.then(() => { this.pendingCount--; this.fireStatus(); })
      .catch(e => {
        this.pendingCount--;
        if (id) delete this.last[id];
        const msg = FB.storeError((e && e.code) || 'hata');
        this.setStatus('error', msg);
        if (typeof toast === 'function') toast('Kayıt buluta yazılamadı: ' + msg, 'error', 7000);
        clearTimeout(this.retry); this.dirty = true;
        this.retry = setTimeout(() => this.flush(), 15000);
      });
  },
  fireStatus() {
    if (this.status === 'error' && this.pendingCount > 0) return;
    if (!navigator.onLine) return this.setStatus('offline', 'Çevrimdışı: değişiklikler bu cihazda saklanıyor, bağlantı gelince eşitlenecek.');
    if (this.pendingCount > 0 || this.dirty) return this.setStatus('saving');
    this.setStatus('saved');
  },
  async signOut() {
    if (this.pending() && !(await confirmDlg({ title: 'Çıkış yap', text: 'Henüz buluta gönderilmemiş değişiklikler var. Yine de çıkış yapılsın mı?', ok: 'Çıkış yap', danger: true }))) return;
    try { await FB.auth.signOut(); } catch (e) { }
    location.reload();
  }
});

function treeFilters(page) {
  return {
    q: UI.getF(page, 'q', ''), sec: UI.getF(page, 'sec', ''), status: UI.getF(page, 'status', ''), rate: UI.getF(page, 'rate', ''),
    minQ: UI.getF(page, 'minQ', ''), rev: UI.getF(page, 'rev', false), never: UI.getF(page, 'never', false), from: UI.getF(page, 'from', ''), to: UI.getF(page, 'to', '')

}
function treeActive(f) { return !!(f.q || f.status || f.rate || f.minQ || f.rev || f.never || f.from || f.to); }
function leafMatch(id, f) {
  const inf = N(id); const tp = topicGet(id); const st = inf.agg;
  if (f.status === 'tamamlanmadi') { if (tp.status === 'tamamlandi') return false; }
  else if (f.status && (tp.status || 'baslanmadi') !== f.status) return false;
  if (f.rate) {
    const r = rate(st);
    if (f.rate === 'yok' && st.q) return false;
    if (f.rate !== 'yok' && r == null) return false;
    if (f.rate === 'lt55' && !(r < 55)) return false;
    if (f.rate === '55-75' && !(r >= 55 && r < 75)) return false;
    if (f.rate === 'gt75' && !(r >= 75)) return false;
  }
  if (f.minQ && st.q < int(f.minQ)) return false;
  if (f.rev && !(tp.rev && tp.rev.active && tp.rev.next && tp.rev.next <= today())) return false;
  if (f.never && (st.n > 0 || (tp.status && tp.status !== 'baslanmadi'))) return false;
  if (f.from || f.to) {
    const ls = (idx().byTopic.get(id) || []).filter(l => (!f.from || l.d >= f.from) && (!f.to || l.d <= f.to));
    if (!ls.length) return false;
  }
  return true;
}
function visibleSet(rootIds, f) {
  if (!treeActive(f)) return null;
  const vis = new Set(); const q = (f.q || '').toLocaleLowerCase('tr');
  const walk = (n, nameHit) => {
    const hit = nameHit || (q && n.name.toLocaleLowerCase('tr').includes(q)) || (q && (n.list || []).some(x => x.toLocaleLowerCase('tr').includes(q)));
    const isLeaf = !n.ch || !n.ch.length;
    let any = false;
    if (isLeaf) any = (!q || hit) && leafMatch(n.id, f);
    else for (const c of n.ch) if (walk(c, hit)) any = true;
    if (!isLeaf && hit && !any && !(f.status || f.rate || f.minQ || f.rev || f.never || f.from || f.to)) any = true;
    if (any) vis.add(n.id);
    return any;
  };
  rootIds.forEach(id => { const fn = findNode(id); if (fn) walk(fn.node, false); });
  return vis;
}
function renderTree(rootIds, f, opts = {}) {
  const vis = visibleSet(rootIds, f);
  if (UI.defaultOpen) { for (const r of S.tree) { UI.open.add(r.id); r.ch.forEach(d => UI.open.add(d.id)); } UI.defaultOpen = false; UI.saveOpen(); }
  let h = '';

    if (vis && !vis.has(n.id)) return;

    const isLeaf = inf.leaf; const open = vis ? true : UI.open.has(n.id);
    const never = isLeaf && !st.n && (tp.status || 'baslanmadi') === 'baslanmadi' && !inf.opt;
    const rv = tp.rev && tp.rev.active ? tp.rev : null;
    const meta = [];

    if (st.q) meta.push(`<span class="num">${fmtNum(st.q)} soru</span>`, rateChip(st));
    else if (isLeaf) meta.push('<span>Kayıt yok</span>');
    if (st.last) meta.push(`<span>son: ${relDay(st.last)}</span>`);

    if (!isLeaf) meta.push(`<span>${p.done}/${p.total} tamam</span>`);
    if (isLeaf && n.list && n.list.length) { const dn = (tp.chk || []).length; meta.push(`<span>${dn}/${n.list.length} başlık</span>`); }
    h += `<div class="tn d${Math.min(depth, 2)} ${open && !isLeaf ? 'open' : ''} ${never ? 'never' : ''}" style="padding-left:${10 + depth * 18}px">
      ${isLeaf ? `<span class="tg leaf"><span class="dot-i st-${tp.status || 'baslanmadi'}"></span></span>` : `<button class="tg" data-act="tg" data-id="${n.id}" aria-label="${open ? 'Daralt' : 'Genişlet'}" aria-expanded="${open}">${ic('chev', 'sm')}</button>`}
      <div class="nm"><a href="#konu-${n.id}">${esc(n.name)}</a><div class="meta">${meta.join('<span>·</span>')}</div></div>

  return `<div class="tree">${h}</div>`;
}

function ancestorAt(id, depth) { let cur = N(id); while (cur && cur.depth > depth) cur = N(cur.parent); return cur ? cur.id : id; }
function saveNotes(id, v) { if ((topicGet(id).notes || '') === v) return; commit(s => { T(id).notes = v.slice(0, 5000); }); toast('Not kaydedildi.', 'good', 1800); }
function checklist(id, n, tp) {

  return `${items.length ? `<div class="list">${items.map((it, i) => `<div class="li"><label class="chk" style="flex:1"><input type="checkbox" data-act-change="chk" data-id="${id}" data-t="${esc(it.t)}" ${done.has(it.t) ? 'checked' : ''}><span>${esc(it.t)}</span></label>${it.def ? '' : `<button class="icon-btn sm" data-act="chk-del" data-id="${id}" data-t="${esc(it.t)}" aria-label="Başlığı sil">${ic('x', 'sm')}</button>`}</div>`).join('')}</div>` : '<div class="small muted">Bu konu için başlık tanımlı değil.</div>'}

}

/* ---------- kayıt tablosu (ortak) ---------- */
function logTable(logs, { showTopic = true, totals = null, limit = 0 } = {}) {
  const shown = limit ? logs.slice(0, limit) : logs;
  const srcName = id => id ? (S.sources.find(s => s.id === id)?.name || '—') : '—';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tarih</th>${showTopic ? '<th>Konu</th>' : ''}<th class="hide-sm">Kaynak</th><th class="r">Soru</th><th class="r">D</th><th class="r">Y</th><th class="r">B</th><th class="r hide-sm">Net</th><th class="r">Başarı</th><th class="r hide-sm">Süre</th><th></th></tr></thead><tbody>
    ${shown.map(l => { const r = l.q ? (S.settings.successMode === 'net' ? Math.max(0, netOf(l.c, l.w)) : l.c) / l.q * 100 : null; return `<tr><td class="num" style="white-space:nowrap">${fmtDate(l.d)}</td>${showTopic ? `<td><a href="#konu-${l.t}" class="link">${esc(N(l.t)?.node.name || '?')}</a><div class="tiny muted hide-sm">${esc(pathStr(l.t, 1))}</div></td>` : ''}<td class="hide-sm small">${esc(srcName(l.src))}${l.n ? `<div class="tiny muted">${esc(l.n)}</div>` : ''}</td><td class="r">${l.q}</td><td class="r">${l.c}</td><td class="r">${l.w}</td><td class="r">${l.b}</td><td class="r hide-sm">${l.q ? fmtNet(netOf(l.c, l.w)) : '—'}</td><td class="r">${fmtPct(r)}</td><td class="r hide-sm">${l.m ? fmtMin(l.m) : '—'}</td><td class="act"><button class="icon-btn sm" data-act="log-edit" data-id="${l.id}" aria-label="Düzenle">${ic('edit', 'sm')}</button><button class="icon-btn sm" data-act="log-del" data-id="${l.id}" aria-label="Sil">${ic('trash', 'sm')}</button></td></tr>`; }).join('')}
    ${totals ? `<tr class="tot"><td>Toplam</td>${showTopic ? '<td></td>' : ''}<td class="hide-sm">${totals.n} kayıt</td><td class="r">${fmtNum(totals.q)}</td><td class="r">${fmtNum(totals.c)}</td><td class="r">${fmtNum(totals.w)}</td><td class="r">${fmtNum(totals.b)}</td><td class="r hide-sm">${fmtNet(netOf(totals.c, totals.w))}</td><td class="r">${fmtPct(rate(totals))}</td><td class="r hide-sm">${fmtMin(totals.m)}</td><td></td></tr>` : ''}
  </tbody></table></div>`;
}

/* ---------------- SORU TAKİBİ ---------------- */
function filteredLogs(page = 'sorular') {
  const f = { sec: UI.getF(page, 'sec', ''), ders: UI.getF(page, 'ders', ''), topic: UI.getF(page, 'topic', ''), src: UI.getF(page, 'src', ''), from: UI.getF(page, 'from', ''), to: UI.getF(page, 'to', ''), q: UI.getF(page, 'q', '') };
  const q = f.q.toLocaleLowerCase('tr');
  const sub = f.topic ? new Set(descendants(f.topic)) : f.ders ? new Set(descendants(f.ders)) : null;
  const out = S.logs.filter(l => N(l.t) && (!f.sec || secKey(l.t) === f.sec) && (!sub || sub.has(l.t)) && (!f.src || (f.src === '__none' ? !l.src : l.src === f.src)) && (!f.from || l.d >= f.from) && (!f.to || l.d <= f.to) && (!q || pathStr(l.t, 0).toLocaleLowerCase('tr').includes(q) || (l.n || '').toLocaleLowerCase('tr').includes(q)))
    .sort((a, b) => b.d.localeCompare(a.d) || (b.ts || 0) - (a.ts || 0));
  return { f, out };
}

function revStart(id, date) {
  commit(s => { const t = T(id); t.rev = { stage: 0, active: true, next: date || addDays(today(), S.settings.intervals[0] || 1), hist: (t.rev && t.rev.hist) || [] }; });
  toast(`Tekrar planlandı: ${fmtDate(topicGet(id).rev.next, true)}.`, 'good');
}
function revDone(id) {
  const t0 = topicGet(id); if (!t0.rev || !t0.rev.active) { toast('Bu konu için aktif tekrar yok.'); return; }
  const L = S.settings.intervals; let msg = '';
  commit(s => {
    const t = T(id); const stage = t.rev.stage || 0;
    t.rev.hist = (t.rev.hist || []).concat({ d: today(), stage });
    s.revlog.push({ id: uid(), t: id, d: today(), stage, ts: Date.now() });
    if (stage + 1 < L.length) { t.rev.stage = stage + 1; t.rev.next = addDays(today(), L[stage + 1]); msg = `Sonraki tekrar: ${fmtDate(t.rev.next, true)} (${L[stage + 1]} gün sonra).`; }
    else { t.rev.active = false; t.rev.done = true; t.rev.stage = L.length; msg = 'Tekrar döngüsü tamamlandı!'; }
  });
  toast('Tekrar tamamlandı. ' + msg, 'good', 4000);
}
function revSnooze(id, days = 1) { commit(s => { const t = T(id); if (t.rev) t.rev.next = addDays(t.rev.next < today() ? today() : t.rev.next, days); }); toast('Tekrar ertelendi: ' + fmtDate(topicGet(id).rev.next, true)); }
async function revStop(id) { if (!(await confirmDlg({ title: 'Tekrarı durdur', text: `<b>${esc(N(id).node.name)}</b> için planlanmış tekrar durdurulsun mu? Geçmiş tekrar kayıtların korunur.`, ok: 'Durdur', danger: true }))) return; commit(s => { const t = T(id); if (t.rev) t.rev.active = false; }); toast('Tekrar durduruldu.'); }
function revDateDlg(id) {
  const cur = topicGet(id).rev;
  openModal({
    title: 'Tekrar tarihi seç', body: `<div class="field"><label>${esc(N(id).node.name)} için tekrar tarihi</label><input type="date" id="rv-d" value="${cur && cur.active ? cur.next : addDays(today(), 1)}" min="${today()}"></div>`,
    foot: '<button class="btn" data-close>Vazgeç</button><button class="btn primary" data-ok>Kaydet</button>',
    onMount: (el, m) => el.querySelector('[data-ok]').addEventListener('click', () => {
      const v = el.querySelector('#rv-d').value; if (!isDKey(v)) { toast('Geçerli bir tarih seç.', 'error'); return; }
      if (cur && cur.active) { commit(s => { T(id).rev.next = v; }); toast('Tekrar tarihi güncellendi.', 'good'); } else revStart(id, v);
      m.close();
    })
  });
}

        for (const k of ['say', 'soz']) { const v = read(k); const ok = v.b >= 0 && v.c + v.w + v.b === 50; tn += netOf(v.c, v.w); f.querySelector(`[data-net="${k}"]`).innerHTML = ok ? `Net: <b>${fmtNet(netOf(v.c, v.w))}</b> · Boş: ${v.b}` : `<span style="color:var(--crit-text)">Doğru + Yanlış + Boş = 50 olmalı (şu an ${v.c + v.w + Math.max(0, v.b)})</span>`; }
        const s = read('say'), z = read('soz');
        f.querySelector('[data-total]').innerHTML = `${ic('info', 'sm')}<span>Toplam: ${s.c + z.c} doğru · ${s.w + z.w} yanlış · ${Math.max(0, s.b) + Math.max(0, z.b)} boş · <b>${fmtNet(tn)} net</b>${(netOf(s.c, s.w) < 1 || netOf(z.c, z.w) < 1) && (s.c + z.c) ? ' · ⚠ DGS puanı için iki testten de en az 1 ham puan gerekir.' : ''}</span>`;
      };
      f.addEventListener('input', upd); upd();
      el.querySelector('[data-save]').addEventListener('click', () => {
        const err = msg => { f.querySelector('[data-err]').textContent = msg; };
        const name = g('name').value.trim(); const d = g('d').value;
        if (!name) return err('Deneme adını yaz.');
        if (!isDKey(d) || d > today()) return err('Geçerli bir tarih seç (gelecek tarih olamaz).');
        for (const n of ['sayc', 'sayw', 'sayb', 'sozc', 'sozw', 'sozb', 'm']) { const v = g(n).value.trim(); if (v !== '' && !/^\d+$/.test(v)) return err('Sayı alanlarına yalnızca 0 veya pozitif tam sayı girilebilir.'); }
        const s = read('say'), z = read('soz');
        for (const [v, lb] of [[s, 'Sayısal'], [z, 'Sözel']]) if (v.b < 0 || v.c + v.w + v.b !== 50) return err(`${lb}: Doğru + Yanlış + Boş toplamı 50 olmalı.`);
        const obj = { name: name.slice(0, 120), d, say: s, soz: z, m: int(g('m').value), pub: g('pub').value.trim().slice(0, 120), n: g('n').value.trim().slice(0, 2000) };
        commit(st => { if (ex) Object.assign(st.exams.find(x => x.id === ex.id), obj); else st.exams.push({ id: uid(), ts: Date.now(), ...obj }); });
        const c = examCalc(obj); toast(`${ex ? 'Deneme güncellendi' : 'Deneme eklendi'}: ${fmtNet(c.net)} net (Say ${fmtNet(c.sayNet)} · Söz ${fmtNet(c.sozNet)}).`, 'good', 4000);
        m.close();
      });
    }
  });
}

    for (const [id, x] of a) { const y = b.get(id); if (y && x.q >= 10 && y.q >= 10) imp.push({ id, d: rate(x) - rate(y), x, y }); } imp.sort((p, q) => q.d - p.d); }
  const cmpRow = (label, a, b, fmt, better = 1) => { const d = a - b; const cls = d === 0 || !isFinite(d) ? '' : (d * better > 0 ? 'good' : 'crit'); return `<tr><td>${label}</td><td class="r">${fmt(a)}</td><td class="r">${fmt(b)}</td><td class="r"><span class="chip ${cls}">${isFinite(d) ? (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '') + fmt(Math.abs(d)) : '—'}</span></td></tr>`; };
